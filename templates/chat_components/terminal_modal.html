<!-- Live Embedded Terminal Console Modal -->
<div id="terminal-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-[120] hidden flex items-center justify-center p-2 sm:p-4">
    <div class="w-full max-w-5xl h-[88vh] bg-[#0c0c10] border border-gray-700/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        <!-- Terminal Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800 bg-[#121218] shrink-0">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <span id="terminal-status-indicator" class="w-2.5 h-2.5 rounded-full bg-gray-500"></span>
                    <span class="font-mono text-xs font-bold text-gray-200">Cline CLI Live Stream</span>
                </div>
                <span id="terminal-pid-badge" class="hidden px-2 py-0.5 text-[10px] font-mono bg-blue-500/10 text-blue-400 border border-blue-500/30 rounded">PID: -</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-terminate-cli" onclick="terminateRunningCli()" class="hidden px-2.5 py-1 bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/40 rounded-lg text-xs font-semibold flex items-center gap-1 transition-all">
                    <span>⏹</span>
                    <span>Kill Task</span>
                </button>
                <button onclick="clearTerminalLogs()" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-mono transition-all">Clear</button>
                <button onclick="copyTerminalLogs(this)" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-mono transition-all">Copy</button>
                <button onclick="toggleTerminalConsole()" class="p-1 text-gray-400 hover:text-white rounded-lg">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Terminal Output Area -->
        <div id="terminal-logs-body" class="flex-1 p-4 bg-[#08080a] overflow-y-auto text-xs font-mono text-gray-300 space-y-1 select-text">
            <div class="text-gray-500 italic">Terminal stream initialized. Awaiting commands...</div>
        </div>

        <!-- Terminal Footer Status Bar -->
        <div class="px-4 py-2 border-t border-gray-800/80 bg-[#101015] flex items-center justify-between text-[11px] text-gray-400 font-mono shrink-0">
            <div class="flex items-center gap-2">
                <span id="cli-path-label" class="truncate max-w-md">Path: Detecting cline...</span>
            </div>
            <div class="flex items-center gap-3">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="chk-autoscroll" checked class="rounded bg-gray-900 border-gray-700 text-blue-500 w-3 h-3">
                    <span>Autoscroll</span>
                </label>
            </div>
        </div>
    </div>
</div>
