<!-- Sessions History Drawer -->
<div id="sessions-drawer" class="fixed inset-y-0 right-0 w-full sm:w-80 md:w-96 bg-[#111115] border-l border-gray-800 shadow-2xl z-50 transform translate-x-full drawer-slide flex flex-col">
    <div class="px-5 py-4 border-b border-gray-800 bg-[#0d0d10] flex items-center justify-between">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="font-bold text-sm text-gray-100">Project Chat History</span>
        </div>
        <button onclick="toggleSessionsDrawer()" class="p-1.5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>

    <div class="p-3 border-b border-gray-800/80 bg-[#141419]">
        <button onclick="createNewSessionPrompt()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow transition-all active:scale-95">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            <span>New Conversation Session</span>
        </button>
    </div>

    <div id="sessions-list" class="flex-1 overflow-y-auto divide-y divide-gray-800/50 p-2">
        <!-- Sessions list injected dynamically -->
    </div>
</div>
