<script>
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    const messageInput = document.getElementById('message-input');
    const pathInput = document.getElementById('project-path-input');
    const searchInput = document.getElementById('project-search-input');
    const messagesContainer = document.getElementById('messages-container');
    const messagesArea = document.getElementById('messages-area');
    
    let allProjects = [];
    let allProjectFiles = [];
    let currentSessions = [];
    let activeSessionId = 'default';
    let ongoingContextEnabled = true;
    let mentionQuery = '';
    let mentionActive = false;
    let selectedMentionIdx = 0;
    let localMessages = [];
    let isWaitingForResponse = false;
    let logPollIndex = 0;
    let terminalPollInterval = null;
    let expandedOutputIds = new Set();
    let lastRenderedJson = '';

    // Models mapping
    const modelInfo = {
        'gemini': { label: 'Gemini 2.5', icon: '🧠' },
        'deepseek': { label: 'DeepSeek V3', icon: '🔍' },
        'aistudio': { label: 'Studio Pro', icon: '🎨' },
        'aistudio_flash': { label: 'Studio Flash', icon: '⚡' },
        'gemini-3.1-flash-lite-preview': { label: 'Flash Lite', icon: '✨' }
    };

    // --- Init & Load Data ---
    async function init() {
        await checkCliDiagnostics();
        await loadCurrentModel();
        await loadProjects();
        await loadProjectSessions();
        await fetchProjectFiles();
        await fetchMessages(true);
        checkCurrentProjectGit();
        startTerminalPolling();
    }
    init();

    // --- CLI Diagnostics ---
    async function checkCliDiagnostics() {
        try {
            const res = await fetch('/api/cli_status');
            const data = await res.json();
            const banner = document.getElementById('cli-warning-banner');
            const pathLabel = document.getElementById('cli-path-label');
            if (pathLabel) {
                pathLabel.textContent = `Executable: ${data.executable || 'Not found in PATH'}`;
            }
            if (!data.is_installed) {
                if (banner) banner.classList.remove('hidden');
            } else {
                if (banner) banner.classList.add('hidden');
            }
        } catch (e) {
            console.error("CLI status error", e);
        }
    }

    // --- Live Terminal Console Logic ---
    window.toggleTerminalConsole = function() {
        const modal = document.getElementById('terminal-modal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) {
            pollTerminalLogs();
        }
    };

    function startTerminalPolling() {
        if (terminalPollInterval) clearInterval(terminalPollInterval);
        terminalPollInterval = setInterval(pollTerminalLogs, 1200);
    }

    async function pollTerminalLogs() {
        try {
            const res = await fetch(`/api/cli_logs?since=${logPollIndex}`);
            if (!res.ok) return;
            const data = await res.json();
            
            const dot = document.getElementById('terminal-pulse-dot');
            const modalDot = document.getElementById('terminal-status-indicator');
            const killBtn = document.getElementById('btn-terminate-cli');
            const pidBadge = document.getElementById('terminal-pid-badge');
            
            if (data.is_running) {
                if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-ping';
                if (modalDot) modalDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
                if (killBtn) killBtn.classList.remove('hidden');
                if (pidBadge && data.pid) {
                    pidBadge.textContent = `PID: ${data.pid}`;
                    pidBadge.classList.remove('hidden');
                }
            } else {
                if (dot) dot.className = 'w-2 h-2 rounded-full bg-gray-500';
                if (modalDot) modalDot.className = 'w-2.5 h-2.5 rounded-full bg-gray-500';
                if (killBtn) killBtn.classList.add('hidden');
                if (pidBadge) pidBadge.classList.add('hidden');
            }

            if (data.logs && data.logs.length > 0) {
                const logsBody = document.getElementById('terminal-logs-body');
                const autoscroll = document.getElementById('chk-autoscroll').checked;

                data.logs.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'terminal-log-row flex items-start gap-2';
                    
                    let streamColor = 'text-gray-300';
                    if (item.stream === 'stderr') streamColor = 'text-red-400';
                    else if (item.stream === 'system') streamColor = 'text-blue-400 font-semibold';
                    else if (item.stream === 'stdout') streamColor = 'text-gray-200';

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'text-gray-600 select-none text-[10px]';
                    timeSpan.textContent = `[${item.timestamp}]`;

                    const textSpan = document.createElement('span');
                    textSpan.className = `${streamColor} whitespace-pre-wrap break-all flex-1 select-text`;
                    textSpan.textContent = item.text || '';

                    row.appendChild(timeSpan);
                    row.appendChild(textSpan);
                    logsBody.appendChild(row);
                });

                logPollIndex = data.next_index;

                if (autoscroll) {
                    logsBody.scrollTop = logsBody.scrollHeight;
                }
            }
        } catch (e) {
            console.error("Terminal poll error", e);
        }
    }

    window.terminateRunningCli = async function() {
        if (!confirm("Are you sure you want to kill the active Cline CLI process?")) return;
        try {
            await fetch('/api/cli_terminate', { method: 'POST', headers: { 'X-CSRFToken': csrfToken } });
            pollTerminalLogs();
        } catch (e) {
            alert("Error killing task: " + e.message);
        }
    };

    window.clearTerminalLogs = async function() {
        try {
            await fetch('/api/cli_clear_logs', { method: 'POST', headers: { 'X-CSRFToken': csrfToken } });
            document.getElementById('terminal-logs-body').innerHTML = '<div class="text-gray-500 italic">Logs cleared.</div>';
            logPollIndex = 0;
        } catch (e) {
            console.error("Clear error", e);
        }
    };

    window.copyTerminalLogs = function(btn) {
        const body = document.getElementById('terminal-logs-body');
        navigator.clipboard.writeText(body.innerText).then(() => {
            const prev = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = prev, 1500);
        });
    };

    // --- Model Selector Logic ---
    window.toggleModelDropdown = function() {
        const menu = document.getElementById('model-dropdown-menu');
        menu.classList.toggle('hidden');
    };

    document.addEventListener('click', (e) => {
        const btn = document.getElementById('model-selector-btn');
        const menu = document.getElementById('model-dropdown-menu');
        if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
            menu.classList.add('hidden');
        }
    });

    async function loadCurrentModel() {
        try {
            const res = await fetch('/model');
            if (res.ok) {
                const data = await res.json();
                updateModelUI(data.model);
            }
        } catch (e) {
            console.error("Failed to load model", e);
        }
    }

    function updateModelUI(modelName) {
        const info = modelInfo[modelName] || { label: modelName, icon: '🤖' };
        const labelEl = document.getElementById('active-model-label');
        const iconEl = document.getElementById('active-model-icon');
        if (labelEl) labelEl.textContent = info.label;
        if (iconEl) iconEl.textContent = info.icon;

        document.querySelectorAll('.model-option').forEach(btn => {
            const isSelected = btn.getAttribute('data-model') === modelName;
            const check = btn.querySelector('.check-icon');
            if (isSelected) {
                btn.classList.add('bg-blue-600/20', 'text-blue-300');
                if (check) check.classList.remove('hidden');
            } else {
                btn.classList.remove('bg-blue-600/20', 'text-blue-300');
                if (check) check.classList.add('hidden');
            }
        });
    }

    window.selectAiModel = async function(modelName) {
        try {
            const res = await fetch('/model', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ model: modelName })
            });
            const data = await res.json();
            if (data.success) {
                updateModelUI(data.model);
                document.getElementById('model-dropdown-menu').classList.add('hidden');
            } else {
                alert("Failed to switch model: " + (data.error || "Unknown error"));
            }
        } catch (e) {
            alert("Error switching model: " + e.message);
        }
    };

    // --- Ongoing Context Toggle ---
    window.toggleOngoingContext = function() {
        ongoingContextEnabled = !ongoingContextEnabled;
        const btnMob = document.getElementById('btn-context-mobile');
        const textSpan = document.getElementById('context-pill-text');
        
        if (ongoingContextEnabled) {
            if (textSpan) textSpan.textContent = 'Context: On';
            btnMob.className = 'px-2.5 py-1.5 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-400 flex items-center gap-1.5 shrink-0 active:scale-95 transition-all';
        } else {
            if (textSpan) textSpan.textContent = 'Context: Off';
            btnMob.className = 'px-2.5 py-1.5 rounded-xl bg-gray-800 border border-gray-700 text-gray-400 flex items-center gap-1.5 shrink-0 active:scale-95 transition-all';
        }
    };

    // --- Native File Search & @ Mention System ---
    async function fetchProjectFiles(query = '') {
        const path = pathInput.value;
        if (!path) return;
        try {
            const res = await fetch(`/api/project_files?path=${encodeURIComponent(path)}&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data.status === 'success') {
                allProjectFiles = data.files || [];
                renderFileMentionList();
            }
        } catch (e) {
            console.error("File search error", e);
        }
    }

    function triggerFileMentionInput() {
        const val = messageInput.value;
        const caret = messageInput.selectionStart;
        messageInput.value = val.slice(0, caret) + '@' + val.slice(caret);
        messageInput.focus();
        messageInput.selectionStart = messageInput.selectionEnd = caret + 1;
        handleMentionDetection();
    }

    function handleMentionDetection() {
        const text = messageInput.value;
        const caret = messageInput.selectionStart;
        const textBeforeCaret = text.slice(0, caret);
        const match = textBeforeCaret.match(/(?:^|\s)@([a-zA-Z0-9_\-\.\/]*)$/);

        if (match !== null) {
            mentionQuery = match[1];
            mentionActive = true;
            selectedMentionIdx = 0;
            document.getElementById('file-mention-popup').classList.remove('hidden');
            fetchProjectFiles(mentionQuery);
        } else {
            mentionActive = false;
            document.getElementById('file-mention-popup').classList.add('hidden');
        }
    }

    function insertMention(filePath) {
        const text = messageInput.value;
        const caret = messageInput.selectionStart;
        const textBeforeCaret = text.slice(0, caret);
        const textAfterCaret = text.slice(caret);
        const match = textBeforeCaret.match(/(?:^|\s)@([a-zA-Z0-9_\-\.\/]*)$/);

        if (match) {
            const mentionStart = match.index + (match[0].startsWith(' ') ? 1 : 0);
            const newText = text.slice(0, mentionStart) + `@/${filePath} ` + textAfterCaret;
            messageInput.value = newText;
            const newCaretPos = mentionStart + filePath.length + 3;
            messageInput.selectionStart = messageInput.selectionEnd = newCaretPos;
        } else {
            messageInput.value += ` @/${filePath} `;
        }

        mentionActive = false;
        document.getElementById('file-mention-popup').classList.add('hidden');
        messageInput.focus();
        autoResizeTextarea();
    }

    function renderFileMentionList() {
        const list = document.getElementById('file-mention-list');

        if (!allProjectFiles || allProjectFiles.length === 0) {
            list.innerHTML = `<div class="p-3 text-xs text-gray-500 text-center italic">No matching files found in workspace</div>`;
            return;
        }

        let html = '';
        allProjectFiles.slice(0, 12).forEach((file, idx) => {
            const isSelected = idx === selectedMentionIdx;
            const activeClass = isSelected ? 'bg-blue-600/20 border-l-2 border-blue-500 text-blue-300' : 'hover:bg-gray-800/60 border-l-2 border-transparent text-gray-200';
            
            html += `
                <div onclick="insertMention('${file.path.replace(/'/g, "\\'")}')" class="px-3 py-2 cursor-pointer transition-all flex items-center justify-between gap-2 rounded-lg ${activeClass}">
                    <div class="flex items-center gap-2 min-w-0 flex-1">
                        <div class="w-6 h-6 rounded bg-gray-800 border border-gray-700 flex items-center justify-center text-[10px] font-mono font-bold text-blue-400 shrink-0 uppercase">
                            ${file.extension || 'f'}
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-xs font-semibold truncate font-mono">${escapeHtml(file.name)}</span>
                            <span class="text-[10px] text-gray-500 truncate font-mono">${escapeHtml(file.directory || '.')}</span>
                        </div>
                    </div>
                    <span class="text-[10px] font-mono text-gray-500 shrink-0">@/${escapeHtml(file.path)}</span>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    messageInput.addEventListener('input', () => {
        autoResizeTextarea();
        handleMentionDetection();
    });

    messageInput.addEventListener('keydown', (e) => {
        if (mentionActive && allProjectFiles.length > 0) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedMentionIdx = (selectedMentionIdx + 1) % Math.min(allProjectFiles.length, 12);
                renderFileMentionList();
                return;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedMentionIdx = (selectedMentionIdx - 1 + Math.min(allProjectFiles.length, 12)) % Math.min(allProjectFiles.length, 12);
                renderFileMentionList();
                return;
            } else if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) {
                e.preventDefault();
                if (allProjectFiles[selectedMentionIdx]) {
                    insertMention(allProjectFiles[selectedMentionIdx].path);
                    return;
                }
            } else if (e.key === 'Escape') {
                mentionActive = false;
                document.getElementById('file-mention-popup').classList.add('hidden');
                return;
            }
        }

        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            addToQueue();
        }
    });

    function autoResizeTextarea() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + 'px';
    }

    // --- Sessions & History Management ---
    window.toggleSessionsDrawer = function() {
        const drawer = document.getElementById('sessions-drawer');
        drawer.classList.toggle('translate-x-full');
        if (!drawer.classList.contains('translate-x-full')) {
            loadProjectSessions();
        }
    };

    async function loadProjectSessions() {
        const projectName = searchInput.value || 'default';
        try {
            const res = await fetch(`/api/chat_sessions?project=${encodeURIComponent(projectName)}`);
            const data = await res.json();
            if (data.status === 'success') {
                currentSessions = data.sessions || [];
                renderSessionsList();
                
                const active = currentSessions.find(s => s.is_active);
                if (active) {
                    activeSessionId = active.id;
                    const sessionTitle = document.getElementById('session-title-label');
                    if (sessionTitle) sessionTitle.textContent = active.title;
                }
            }
        } catch (e) {
            console.error("Session load error", e);
        }
    }

    function renderSessionsList() {
        const list = document.getElementById('sessions-list');
        if (!currentSessions || currentSessions.length === 0) {
            list.innerHTML = `<div class="p-4 text-xs text-gray-500 text-center italic">No saved chat sessions for this project</div>`;
            return;
        }

        let html = '';
        currentSessions.forEach(s => {
            const activeBorder = s.is_active ? 'border-blue-500 bg-blue-500/10' : 'border-gray-800 bg-[#15151a] hover:bg-[#1c1c24]';
            html += `
                <div class="p-3 rounded-xl border ${activeBorder} transition-all flex items-center justify-between gap-2 mb-1.5 cursor-pointer group" onclick="selectSession('${s.id}')">
                    <div class="flex flex-col min-w-0 flex-1">
                        <span class="text-xs font-semibold text-gray-200 truncate ${s.is_active ? 'text-blue-300 font-bold' : ''}">${escapeHtml(s.title)}</span>
                        <span class="text-[10px] text-gray-500 truncate mt-0.5">${escapeHtml(s.last_message || 'Empty session')}</span>
                        <span class="text-[9px] font-mono text-gray-600 mt-1">${escapeHtml(s.updated_at)}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        ${s.is_active ? '<span class="w-2 h-2 rounded-full bg-blue-400"></span>' : ''}
                        <button onclick="event.stopPropagation(); deleteSession('${s.id}')" class="p-1 text-gray-600 hover:text-red-400 transition-colors" title="Delete Session">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    window.selectSession = async function(sessionId) {
        const projectName = searchInput.value || 'default';
        try {
            const res = await fetch('/api/chat_session/select', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ project: projectName, session_id: sessionId })
            });
            const data = await res.json();
            if (data.status === 'success') {
                activeSessionId = sessionId;
                const drawer = document.getElementById('sessions-drawer');
                if (drawer && !drawer.classList.contains('translate-x-full')) {
                    toggleSessionsDrawer();
                }
                await loadProjectSessions();
                localMessages = data.messages || [];
                lastRenderedJson = '';
                renderMessages(localMessages, true);
            }
        } catch (e) {
            console.error("Select session error", e);
        }
    };

    window.createNewSessionPrompt = async function() {
        const title = prompt("Enter a topic/title for this new session (leave blank for auto):", "");
        if (title === null) return;

        const projectName = searchInput.value || 'default';
        try {
            const res = await fetch('/api/chat_session/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ project: projectName, title: title.trim() })
            });
            const data = await res.json();
            if (data.status === 'success') {
                activeSessionId = data.session_id;
                const drawer = document.getElementById('sessions-drawer');
                if (drawer && !drawer.classList.contains('translate-x-full')) {
                    toggleSessionsDrawer();
                }
                await loadProjectSessions();
                localMessages = [];
                lastRenderedJson = '';
                renderMessages([], true);
            }
        } catch (e) {
            console.error("Create session error", e);
        }
    };

    window.deleteSession = async function(sessionId) {
        if (!confirm("Are you sure you want to delete this conversation session?")) return;
        const projectName = searchInput.value || 'default';
        try {
            const res = await fetch('/api/chat_session/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ project: projectName, session_id: sessionId })
            });
            const data = await res.json();
            if (data.status === 'success') {
                await loadProjectSessions();
                lastRenderedJson = '';
                fetchMessages(true);
            }
        } catch (e) {
            console.error("Delete session error", e);
        }
    };

    // --- Project Picker ---
    window.toggleProjectPicker = function() {
        const modal = document.getElementById('project-picker-modal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) {
            renderProjectPicker();
        }
    };

    async function loadProjects() {
        try {
            const res = await fetch('/api/projects_list');
            allProjects = await res.json();
        } catch (e) {
            console.error("Failed to load projects", e);
        }
    }

    function renderProjectPicker() {
        const filter = (document.getElementById('picker-search-input').value || '').toLowerCase();
        const list = document.getElementById('project-picker-list');

        let html = '';
        allProjects.forEach(p => {
            if (filter && !p.name.toLowerCase().includes(filter) && !p.path.toLowerCase().includes(filter)) return;
            html += `
                <div onclick="switchProject('${p.name}', '${p.path.replace(/\\/g, '\\\\')}')" class="p-3 hover:bg-blue-500/10 cursor-pointer flex items-center justify-between rounded-xl transition-all">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-8 h-8 rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center shrink-0">
                            <svg class="w-4 h-4 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="text-xs font-semibold text-gray-100 truncate">${escapeHtml(p.name)}</span>
                            <span class="text-[10px] text-gray-500 truncate font-mono">${escapeHtml(p.path)}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        list.innerHTML = html || `<div class="p-4 text-xs text-gray-500 text-center">No projects found</div>`;
    }

    window.switchProject = function(name, path) {
        window.location.href = `/chat?project=${encodeURIComponent(name)}`;
    };

    // --- Clean Plain-Text Message Rendering (No Injection Vulnerabilities) ---
    function escapeHtml(text) {
        return (text || '').replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
    }

    function renderMessages(messages, forceScroll = false) {
        const currentJson = JSON.stringify({ msgs: messages, waiting: isWaitingForResponse });
        if (currentJson === lastRenderedJson) return;
        lastRenderedJson = currentJson;

        // Check if user is currently scrolled up
        const isNearBottom = (messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight) < 120;

        messagesContainer.innerHTML = '';

        if (!messages || messages.length === 0) {
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'p-6 rounded-2xl bg-[#131317]/80 border border-gray-800/80 text-center max-w-md mx-auto my-auto shadow-xl';
            welcomeDiv.innerHTML = `
                <div class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center mx-auto mb-3 text-blue-400">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </div>
                <h3 class="font-bold text-sm text-gray-100 mb-1">Connected to ${escapeHtml(searchInput.value)}</h3>
                <p class="text-xs text-gray-400 mb-3">Tasks execute directly via <span class="text-emerald-400 font-mono font-semibold">cline</span> CLI. You can view live output in the Terminal panel.</p>
            `;
            messagesContainer.appendChild(welcomeDiv);
        } else {
            messages.forEach((msg, idx) => {
                const isUser = msg.role === 'user';
                const msgKey = msg.id || `msg_${idx}`;
                const row = document.createElement('div');
                row.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

                const bubble = document.createElement('div');
                bubble.className = isUser
                    ? 'bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-2.5 max-w-[90%] sm:max-w-[80%] shadow-lg text-xs sm:text-sm leading-relaxed select-text'
                    : 'bg-[#15151a] border border-gray-700/80 text-gray-200 rounded-2xl rounded-tl-none px-4 py-2.5 max-w-[90%] sm:max-w-[80%] shadow-md text-xs sm:text-sm leading-relaxed select-text';

                const meta = document.createElement('div');
                meta.className = `text-[10px] mb-1 font-medium ${isUser ? 'text-blue-200' : 'text-gray-500'}`;
                meta.textContent = isUser ? `You • ${msg.time || ''}` : `Cline CLI • ${msg.time || ''}`;

                // Clean plain-text content container
                const body = document.createElement('div');
                body.className = 'whitespace-pre-wrap break-words font-sans text-xs sm:text-sm';
                body.textContent = msg.text || '';

                bubble.appendChild(meta);
                bubble.appendChild(body);

                if (!isUser && msg.full_text) {
                    const expandContainer = document.createElement('div');
                    expandContainer.className = 'mt-3 border-t border-gray-700/50 pt-2';
                    
                    const isExpanded = expandedOutputIds.has(msgKey);

                    const expandBtn = document.createElement('button');
                    expandBtn.className = 'text-[10px] text-blue-400 hover:text-blue-300 font-mono flex items-center gap-1 transition-colors w-full text-left focus:outline-none';
                    expandBtn.innerHTML = `
                        <svg class="w-3 h-3 transform transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                        <span>${isExpanded ? 'Hide Full Output' : 'Show Full Output'}</span>
                    `;
                    
                    const fullTextDiv = document.createElement('div');
                    fullTextDiv.className = `${isExpanded ? '' : 'hidden'} mt-2 p-2.5 bg-[#09090b] rounded-lg border border-gray-700/50 text-[10px] text-gray-300 font-mono whitespace-pre-wrap overflow-x-auto max-h-96 overflow-y-auto select-text shadow-inner`;
                    fullTextDiv.textContent = msg.full_text;
                    
                    expandBtn.onclick = () => {
                        if (expandedOutputIds.has(msgKey)) {
                            expandedOutputIds.delete(msgKey);
                            fullTextDiv.classList.add('hidden');
                            expandBtn.querySelector('svg').classList.remove('rotate-180');
                            expandBtn.querySelector('span').textContent = 'Show Full Output';
                        } else {
                            expandedOutputIds.add(msgKey);
                            fullTextDiv.classList.remove('hidden');
                            expandBtn.querySelector('svg').classList.add('rotate-180');
                            expandBtn.querySelector('span').textContent = 'Hide Full Output';
                        }
                    };
                    
                    expandContainer.appendChild(expandBtn);
                    expandContainer.appendChild(fullTextDiv);
                    bubble.appendChild(expandContainer);
                }

                row.appendChild(bubble);
                messagesContainer.appendChild(row);
            });
        }

        if (isWaitingForResponse) {
            const thinkingRow = document.createElement('div');
            thinkingRow.className = 'flex justify-start';
            thinkingRow.innerHTML = `
                <div class="bg-[#15151a] border border-gray-700/80 text-gray-300 rounded-2xl rounded-tl-none px-4 py-2.5 max-w-[80%] shadow-md text-xs flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span class="text-gray-400 font-mono text-[11px]">Cline CLI is processing task...</span>
                </div>
            `;
            messagesContainer.appendChild(thinkingRow);
        }

        if (forceScroll || isNearBottom) {
            scrollToBottom();
        }
    }

    function scrollToBottom() {
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    async function fetchMessages(forceScroll = false) {
        const projectName = searchInput.value || 'default';
        try {
            const res = await fetch(`/get_messages?project=${encodeURIComponent(projectName)}&session=${encodeURIComponent(activeSessionId)}`);
            if (res.ok) {
                const msgs = await res.json();
                if (Array.isArray(msgs)) {
                    localMessages = msgs;
                    if (localMessages.length > 0 && localMessages[localMessages.length - 1].role === 'assistant') {
                        isWaitingForResponse = false;
                    }
                    renderMessages(localMessages, forceScroll);
                }
            }
        } catch (e) {
            console.error("Messages poll error", e);
        }
    }
    setInterval(fetchMessages, 1500);

    // --- Send & Queue Logic ---
    window.addToQueue = async function() {
        const path = pathInput.value;
        const name = searchInput.value.trim();
        let msg = messageInput.value.trim();
        const isVisibleWin = document.getElementById('chk-visible-terminal').checked;

        if (!path || !name) {
            alert("Please select a valid project workspace.");
            return;
        }
        if (!msg) return;

        const btn = document.getElementById('btn-queue-action');
        btn.disabled = true;

        const now = new Date();
        const timeString = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
        
        localMessages.push({
            id: 'msg_temp_' + Date.now(),
            role: 'user',
            text: msg,
            time: timeString
        });
        isWaitingForResponse = true;
        renderMessages(localMessages, true);

        messageInput.value = '';
        messageInput.style.height = 'auto';

        if (ongoingContextEnabled) {
            try {
                const ctxRes = await fetch(`/api/project_context?project=${encodeURIComponent(name)}`);
                const ctxData = await ctxRes.json();
                if (ctxData.status === 'success' && ctxData.context) {
                    msg = `${ctxData.context}\n\nTask:\n${msg}`;
                }
            } catch (e) {
                console.error("Context fetch error", e);
            }
        }

        try {
            const res = await fetch('/api/queue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({
                    project_path: path,
                    project_name: name,
                    message: msg,
                    yolo: true,
                    visible_terminal: isVisibleWin
                })
            });

            if (res.ok) {
                checkCurrentProjectGit();
                fetchMessages(true);
                pollTerminalLogs();
            } else {
                alert("Failed to queue message.");
            }
        } catch (e) {
            alert("Error sending task: " + e.message);
        } finally {
            btn.disabled = false;
        }
    };

    // --- Git Status & Diff Logic ---
    async function checkCurrentProjectGit() {
        const path = pathInput.value;
        if (!path) return;
        try {
            const res = await fetch(`/api/git_status?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            const chipBadge = document.getElementById('chip-git-badge');

            if (data.is_git) {
                const changed = data.changed_count || 0;
                chipBadge.textContent = `${changed} Changes`;
                if (data.branch) {
                    document.getElementById('git-branch-name').textContent = data.branch;
                }
            } else {
                chipBadge.textContent = `Git Diff`;
            }
        } catch (e) {
            console.error("Git status poll error", e);
        }
    }
    setInterval(checkCurrentProjectGit, 5000);

    window.openGitDiffModal = function() {
        document.getElementById('git-diff-modal').classList.remove('hidden');
        refreshGitAll();
    };

    window.closeGitDiffModal = function() {
        document.getElementById('git-diff-modal').classList.add('hidden');
    };

    window.refreshGitAll = async function() {
        const path = pathInput.value;
        if (!path) return;

        const diffArea = document.getElementById('diff-content-area');
        const fileList = document.getElementById('diff-file-list');
        diffArea.innerHTML = '<div class="p-4 text-center text-gray-500">Loading git changes...</div>';

        try {
            const res = await fetch(`/api/git_diff?path=${encodeURIComponent(path)}`);
            const data = await res.json();
            if (data.status === 'success') {
                const diffs = data.diffs || [];
                if (diffs.length === 0) {
                    fileList.innerHTML = '<div class="p-3 text-xs text-gray-500 text-center">Working directory clean</div>';
                    diffArea.innerHTML = '<div class="p-6 text-center text-gray-400 text-xs">No uncommitted changes.</div>';
                    return;
                }

                fileList.innerHTML = diffs.map((d, i) => `
                    <div onclick="showFileDiff(${i})" class="px-3 py-2 text-xs font-mono cursor-pointer hover:bg-gray-800 rounded-lg flex items-center justify-between">
                        <span class="truncate">${escapeHtml(d.file)}</span>
                        <span class="text-emerald-400 text-[10px]">+${d.additions}</span>
                    </div>
                `).join('');

                window.currentDiffs = diffs;
                showFileDiff(0);
            }
        } catch (e) {
            diffArea.innerHTML = `<div class="p-4 text-red-400">Error: ${escapeHtml(e.message)}</div>`;
        }
    };

    window.showFileDiff = function(idx) {
        if (!window.currentDiffs || !window.currentDiffs[idx]) return;
        const item = window.currentDiffs[idx];
        document.getElementById('selected-file-name').textContent = item.file;
        const diffLines = (item.diff || '').split('\n').map(line => {
            let cls = 'text-gray-400';
            if (line.startsWith('+')) cls = 'diff-added px-1';
            else if (line.startsWith('-')) cls = 'diff-deleted px-1';
            else if (line.startsWith('@@')) cls = 'diff-header px-1';
            return `<div class="${cls} whitespace-pre-wrap">${escapeHtml(line)}</div>`;
        }).join('');
        document.getElementById('diff-content-area').innerHTML = diffLines;
    };

    window.handleCommitAndPush = async function() {
        const path = pathInput.value;
        const msgInput = document.getElementById('git-commit-message-input');
        const message = msgInput.value.trim();
        const feedback = document.getElementById('commit-feedback-msg');

        if (!message) {
            alert("Please enter a commit message.");
            return;
        }

        feedback.className = 'text-[11px] p-2 bg-blue-500/10 text-blue-300 block rounded-lg';
        feedback.textContent = 'Committing and pushing...';

        try {
            const res = await fetch('/api/git_commit_push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ path: path, message: message, push: true })
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                feedback.className = 'text-[11px] p-2 bg-emerald-500/15 text-emerald-300 block rounded-lg';
                feedback.textContent = data.message;
                msgInput.value = '';
                refreshGitAll();
            } else {
                feedback.className = 'text-[11px] p-2 bg-red-500/15 text-red-300 block rounded-lg';
                feedback.textContent = data.message || 'Commit failed.';
            }
        } catch (e) {
            feedback.className = 'text-[11px] p-2 bg-red-500/15 text-red-300 block rounded-lg';
            feedback.textContent = e.message;
        }
    };
</script>
