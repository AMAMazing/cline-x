<!-- Top Diagnostic Banner if CLI is missing -->
<div id="cli-warning-banner" class="hidden bg-amber-500/15 border-b border-amber-500/30 px-4 py-2 flex items-center justify-between z-40 text-xs text-amber-200">
    <div class="flex items-center gap-2">
        <span class="font-bold">⚠️ Cline CLI Not Detected:</span>
        <span>Run <code class="bg-black/40 px-2 py-0.5 rounded font-mono text-amber-300">npm install -g cline</code> in terminal to enable CLI execution.</span>
    </div>
    <button onclick="document.getElementById('cli-warning-banner').classList.add('hidden')" class="text-amber-400 hover:text-white">✕</button>
</div>

<!-- Header Navigation -->
<header class="h-14 border-b border-gray-800/80 bg-[#0d0d11]/90 backdrop-blur-md px-3 sm:px-5 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2.5 min-w-0">
        <a href="{{ url_for('project_bp.dashboard') }}" class="p-2 rounded-xl text-gray-400 hover:text-white hover:bg-gray-800/60 active:scale-95 transition-all flex items-center justify-center" title="Back to Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        
        <div id="project-header-info" class="flex items-center gap-2 min-w-0 cursor-pointer hover:opacity-80 transition-opacity" onclick="toggleProjectPicker()">
            <div class="w-8 h-8 rounded-xl bg-gray-800/80 border border-gray-700/60 flex items-center justify-center shrink-0 overflow-hidden shadow-inner" id="project-icon-preview">
                {% if project_has_icon %}
                <img src="/get_icon?path={{ project_path }}" class="w-5 h-5 object-contain" alt="Icon">
                {% else %}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-blue-400"><path d="M19.5 21a3 3 0 0 0 3-3V9a3 3 0 0 0-3-3h-5.379a.75.75 0 0 1-.53-.22L11.47 3.66A2.25 2.25 0 0 0 9.879 3H4.5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h15Z" /></svg>
                {% endif %}
            </div>
            <div class="flex flex-col min-w-0">
                <div class="flex items-center gap-1.5">
                    <span id="current-project-title" class="font-bold text-sm text-gray-100 truncate">{{ project_name }}</span>
                    <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <span id="session-title-label" class="text-[11px] text-blue-400/90 truncate font-medium">Initial Session</span>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-2 relative">
        <!-- Live Terminal Drawer Toggle Button -->
        <button onclick="toggleTerminalConsole()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-gray-800/90 hover:bg-gray-700/80 border border-gray-700/70 text-gray-200 active:scale-95 transition-all shadow-sm" title="Live Cline CLI Terminal">
            <span id="terminal-pulse-dot" class="w-2 h-2 rounded-full bg-gray-500"></span>
            <span class="font-mono">Terminal</span>
        </button>

        <!-- AI Model Selector Dropdown Button -->
        <div class="relative">
            <button id="model-selector-btn" onclick="toggleModelDropdown()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-800/90 hover:bg-gray-700/80 border border-gray-700/70 text-gray-200 active:scale-95 transition-all shadow-sm">
                <span id="active-model-icon">🧠</span>
                <span id="active-model-label" class="hidden sm:inline">Gemini</span>
                <svg class="w-3 h-3 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <!-- Model Popover Menu -->
            <div id="model-dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-[#141418] border border-gray-700/90 rounded-2xl shadow-2xl p-2 z-50 glass-panel">
                <div class="text-[10px] uppercase font-bold text-gray-500 px-2.5 py-1 tracking-wider border-b border-gray-800/80 mb-1">
                    Active Model
                </div>
                <div class="space-y-1">
                    <button onclick="selectAiModel('gemini')" class="w-full text-left px-2.5 py-2 rounded-xl text-xs flex items-center justify-between transition-all hover:bg-blue-600/15 hover:text-blue-300 text-gray-200 group model-option" data-model="gemini">
                        <span class="flex items-center gap-2"><span>🧠</span> Gemini 2.5</span>
                        <span class="check-icon hidden text-blue-400 font-bold">✓</span>
                    </button>
                    <button onclick="selectAiModel('deepseek')" class="w-full text-left px-2.5 py-2 rounded-xl text-xs flex items-center justify-between transition-all hover:bg-blue-600/15 hover:text-blue-300 text-gray-200 group model-option" data-model="deepseek">
                        <span class="flex items-center gap-2"><span>🔍</span> DeepSeek V3</span>
                        <span class="check-icon hidden text-blue-400 font-bold">✓</span>
                    </button>
                    <div class="border-t border-gray-800/60 my-1"></div>
                    <div class="text-[9px] uppercase font-semibold text-gray-500 px-2.5 py-0.5 tracking-wider">AI Studio</div>
                    <button onclick="selectAiModel('aistudio')" class="w-full text-left px-2.5 py-1.5 rounded-xl text-xs flex items-center justify-between transition-all hover:bg-blue-600/15 hover:text-blue-300 text-gray-200 group model-option" data-model="aistudio">
                        <span class="flex items-center gap-2"><span>🎨</span> Pro</span>
                        <span class="check-icon hidden text-blue-400 font-bold">✓</span>
                    </button>
                    <button onclick="selectAiModel('aistudio_flash')" class="w-full text-left px-2.5 py-1.5 rounded-xl text-xs flex items-center justify-between transition-all hover:bg-blue-600/15 hover:text-blue-300 text-gray-200 group model-option" data-model="aistudio_flash">
                        <span class="flex items-center gap-2"><span>⚡</span> Flash</span>
                        <span class="check-icon hidden text-blue-400 font-bold">✓</span>
                    </button>
                    <button onclick="selectAiModel('gemini-3.1-flash-lite-preview')" class="w-full text-left px-2.5 py-1.5 rounded-xl text-xs flex items-center justify-between transition-all hover:bg-blue-600/15 hover:text-blue-300 text-gray-200 group model-option" data-model="gemini-3.1-flash-lite-preview">
                        <span class="flex items-center gap-2"><span>✨</span> Flash Lite</span>
                        <span class="check-icon hidden text-blue-400 font-bold">✓</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sessions Drawer Toggle -->
        <button onclick="toggleSessionsDrawer()" class="p-2 rounded-xl text-gray-300 hover:text-white hover:bg-gray-800/80 active:scale-95 transition-all relative" title="Chat History & Sessions">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span id="sessions-count-dot" class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-blue-500"></span>
        </button>

        <!-- New Session Button -->
        <button onclick="createNewSessionPrompt()" class="p-2 rounded-xl text-blue-400 hover:text-blue-300 hover:bg-blue-500/10 active:scale-95 transition-all" title="Start New Chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
</header>
