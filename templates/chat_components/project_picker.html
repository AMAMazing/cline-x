<!-- Project Switcher Modal -->
<div id="project-picker-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#131317] border border-gray-700/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
        <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between bg-[#0d0d10]">
            <span class="font-bold text-sm text-gray-100">Select Project Workspace</span>
            <button onclick="toggleProjectPicker()" class="text-gray-400 hover:text-white p-1 rounded-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="p-2 border-b border-gray-800">
            <input id="picker-search-input" type="text" placeholder="Search project name..." class="w-full bg-[#1c1c22] border border-gray-700/60 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-blue-500" oninput="renderProjectPicker()">
        </div>
        <div id="project-picker-list" class="overflow-y-auto divide-y divide-gray-800/50 p-1 flex-1">
            <!-- Projects list -->
        </div>
    </div>
</div>
